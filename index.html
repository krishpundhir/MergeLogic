<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In-Place Merge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <div class="tabs" role="tablist" aria-label="Example">
      <button class="tab active" type="button" role="tab" data-ex="0">Example 1</button>
      <button class="tab" type="button" role="tab" data-ex="1">Example 2</button>
    </div>

    <section class="card">
      <code id="callLabel" class="call"></code>

      <div class="viz" id="viz">
        <div class="board" id="board">
          <div class="track" id="track" role="list" aria-label="Array"></div>
          <div class="indices" id="indices" aria-hidden="true"></div>
          <div class="pointers" id="pointers" aria-hidden="true"></div>
        </div>
      </div>

      <p id="opLine" class="op-line"></p>

      <div id="vars" class="vars"></div>

      <nav class="nav" aria-label="Steps">
        <button id="prevBtn" class="btn btn-secondary" type="button">&larr; Previous</button>
        <span id="stepIndicator" class="step-indicator" aria-live="polite"></span>
        <button id="nextBtn" class="btn btn-primary" type="button">Next &rarr;</button>
      </nav>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
